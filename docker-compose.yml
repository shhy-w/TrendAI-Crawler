services:
  mysql:
    image: mysql:8.4
    container_name: trendai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trendai
      MYSQL_USER: trendai
      MYSQL_PASSWORD: trendai_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
